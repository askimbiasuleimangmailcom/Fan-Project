<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Table Fan - Blue Accents</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-size: 14px;
        }

        button:hover {
            background: linear-gradient(135deg, #1976D2, #1565C0);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: linear-gradient(135deg, #64B5F6, #2196F3);
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.5);
        }

        .speed-display {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: bold;
            color: #2196F3;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 20;
            font-size: 16px;
        }

        .info-text {
            position: absolute;
            top: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            z-index: 20;
        }

        @media (max-width: 768px) {
            .ui-container {
                bottom: 20px;
                padding: 12px 15px;
            }

            button {
                padding: 10px 15px;
                font-size: 12px;
            }

            .speed-display {
                top: 15px;
                right: 15px;
                padding: 10px 15px;
                font-size: 14px;
            }

            .info-text {
                top: 15px;
                left: 15px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="info-text">3D Table Fan | Drag to rotate | Scroll to zoom</div>
    <div class="speed-display">Speed: <span id="speedText">Off</span></div>
    
    <div class="ui-container">
        <button onclick="toggleFan()" id="powerBtn">Power</button>
        <button onclick="setSpeed(1)" class="speed-btn">Low</button>
        <button onclick="setSpeed(2)" class="speed-btn">Medium</button>
        <button onclick="setSpeed(3)" class="speed-btn">High</button>
    </div>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 100, 300);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(7, 5.8, 13);
        camera.lookAt(0, 5.4, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 0.65);
        keyLight.position.set(8, 14, 10);
        keyLight.castShadow = true;
        scene.add(keyLight);

        const fillLight = new THREE.PointLight(0xffffff, 0.25, 50);
        fillLight.position.set(-10, 5, 10);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0x7fbfff, 0.35);
        rimLight.position.set(-10, 8, -10);
        scene.add(rimLight);

        // Grid
        const grid = new THREE.GridHelper(40, 20, 0x4d4d4d, 0x2a2a2a);
        grid.position.y = 0;
        scene.add(grid);

        const baseBlue = new THREE.MeshStandardMaterial({ color: 0x57b8ff, metalness: 0.22, roughness: 0.45 });
        const bodyWhite = new THREE.MeshStandardMaterial({ color: 0xf8f9fb, metalness: 0.05, roughness: 0.55 });
        const accentBlue = new THREE.MeshStandardMaterial({ color: 0x2f9cff, metalness: 0.22, roughness: 0.45 });
        const bladeBlue = new THREE.MeshStandardMaterial({ color: 0x8fd8ff, metalness: 0.15, roughness: 0.45 });
        const ventGrey = new THREE.MeshStandardMaterial({ color: 0xd6d8da, metalness: 0.1, roughness: 0.6 });
        const grillLine = new THREE.LineBasicMaterial({ color: 0xbcf2ff });

        const fanGroup = new THREE.Group();
        scene.add(fanGroup);

        const baseBody = new THREE.Mesh(new THREE.BoxGeometry(8.8, 0.9, 4.5), baseBlue);
        baseBody.position.set(0, 0.45, 0);
        baseBody.castShadow = true;
        baseBody.receiveShadow = true;
        fanGroup.add(baseBody);

        const basePanel = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.28, 3.8), bodyWhite);
        basePanel.position.set(0, 0.92, 0);
        basePanel.castShadow = true;
        basePanel.receiveShadow = true;
        fanGroup.add(basePanel);

        const baseFront = new THREE.Mesh(new THREE.CylinderGeometry(2.0, 2.0, 0.6, 32), baseBlue);
        baseFront.rotation.x = Math.PI / 2;
        baseFront.position.set(0, 0.55, 2.05);
        baseFront.castShadow = true;
        baseFront.receiveShadow = true;
        fanGroup.add(baseFront);

        const controlPad = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.16, 1.0), accentBlue);
        controlPad.position.set(0.4, 1.22, 1.35);
        controlPad.castShadow = true;
        controlPad.receiveShadow = true;
        fanGroup.add(controlPad);

        for (let i = 0; i < 3; i++) {
            const button = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.35, 32), accentBlue);
            button.rotation.x = Math.PI / 2;
            button.position.set(-0.55 + i * 0.55, 1.28, 1.35);
            button.castShadow = true;
            button.receiveShadow = true;
            fanGroup.add(button);
        }

        const standCurvePath = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-1.1, 2.05, 0),
            new THREE.Vector3(-1.05, 3.3, 0),
            new THREE.Vector3(0.3, 5.25, 0),
            new THREE.Vector3(1.4, 7.8, 0)
        ]);
        const standTube = new THREE.Mesh(new THREE.TubeGeometry(standCurvePath, 80, 0.26, 16, false), bodyWhite);
        standTube.castShadow = true;
        standTube.receiveShadow = true;
        fanGroup.add(standTube);

        const standBase = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 2.15, 32), bodyWhite);
        standBase.position.set(-1.1, 2.05, 0);
        standBase.castShadow = true;
        standBase.receiveShadow = true;
        fanGroup.add(standBase);

        const pivotBall = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), baseBlue);
        pivotBall.position.set(1.4, 7.8, 0);
        pivotBall.castShadow = true;
        pivotBall.receiveShadow = true;
        fanGroup.add(pivotBall);

        const headGroup = new THREE.Group();
        headGroup.position.set(1.4, 7.8, 0);
        headGroup.rotation.z = 0.075;
        headGroup.rotation.x = -0.045;
        fanGroup.add(headGroup);

        const motor = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 2.0, 32), bodyWhite);
        motor.rotation.z = Math.PI / 2;
        motor.position.set(0, 0, 0);
        motor.castShadow = true;
        motor.receiveShadow = true;
        headGroup.add(motor);

        const motorShell = new THREE.Mesh(new THREE.SphereGeometry(1.0, 32, 32), bodyWhite);
        motorShell.position.set(0, 0.03, 0);
        motorShell.scale.set(1, 0.92, 0.92);
        motorShell.castShadow = true;
        motorShell.receiveShadow = true;
        headGroup.add(motorShell);

        const housingBand = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 1.6, 32), accentBlue);
        housingBand.rotation.z = Math.PI / 2;
        housingBand.position.set(-0.1, 0, 0);
        housingBand.castShadow = true;
        housingBand.receiveShadow = true;
        headGroup.add(housingBand);

        const rearCover = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.6, 32), accentBlue);
        rearCover.rotation.z = Math.PI / 2;
        rearCover.position.set(-1.05, 0, 0);
        rearCover.castShadow = true;
        rearCover.receiveShadow = true;
        headGroup.add(rearCover);

        for (let i = -1; i <= 1; i++) {
            const vent = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.05, 0.45), ventGrey);
            vent.position.set(-0.32 + i * 0.4, 0.03, -0.7);
            vent.rotation.y = Math.PI / 12;
            vent.castShadow = true;
            vent.receiveShadow = true;
            headGroup.add(vent);
        }

        const bladeGroup = new THREE.Group();
        bladeGroup.position.set(1.35, 0, 0);
        headGroup.add(bladeGroup);

        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.8, 32), accentBlue);
        hub.rotation.z = Math.PI / 2;
        hub.castShadow = true;
        hub.receiveShadow = true;
        bladeGroup.add(hub);

        const bladeGeometry = new THREE.BoxGeometry(0.12, 4.4, 0.75);
        for (let i = 0; i < 5; i++) {
            const bladeWrapper = new THREE.Group();
            bladeWrapper.rotation.x = (i / 5) * Math.PI * 2;
            const blade = new THREE.Mesh(bladeGeometry, bladeBlue);
            blade.position.set(0, 2.1, 0);
            blade.castShadow = true;
            blade.receiveShadow = true;
            bladeWrapper.add(blade);
            bladeGroup.add(bladeWrapper);
        }

        const guardFrame = new THREE.Mesh(new THREE.TorusGeometry(3.1, 0.12, 16, 120), accentBlue);
        guardFrame.rotation.y = Math.PI / 2;
        guardFrame.position.set(1.3, 0, 0);
        guardFrame.castShadow = true;
        guardFrame.receiveShadow = true;
        headGroup.add(guardFrame);

        const meshGroup = new THREE.Group();
        const meshRadius = 3.15;
        const meshRings = [0.45, 0.95, 1.45, 1.95, 2.45, 2.95];
        for (let r of meshRings) {
            const circlePoints = [];
            const segmentCount = 72;
            for (let j = 0; j <= segmentCount; j++) {
                const angle = (j / segmentCount) * Math.PI * 2;
                circlePoints.push(new THREE.Vector3(0, Math.cos(angle) * r, Math.sin(angle) * r));
            }
            const circleGeometry = new THREE.BufferGeometry().setFromPoints(circlePoints);
            const circleLine = new THREE.Line(circleGeometry, grillLine);
            meshGroup.add(circleLine);
        }
        const radialLines = 28;
        for (let i = 0; i < radialLines; i++) {
            const angle = (i / radialLines) * Math.PI * 2;
            const linePoints = [
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, Math.cos(angle) * meshRadius, Math.sin(angle) * meshRadius)
            ];
            const lineGeometry = new THREE.BufferGeometry().setFromPoints(linePoints);
            const line = new THREE.Line(lineGeometry, grillLine);
            meshGroup.add(line);
        }
        meshGroup.position.set(1.3, 0, 0);
        headGroup.add(meshGroup);

        const meshGroupBack = meshGroup.clone();
        meshGroupBack.position.x += 0.08;
        headGroup.add(meshGroupBack);

        fanGroup.rotation.y = -0.18;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;
            fanGroup.rotation.y += deltaX * 0.01;
            fanGroup.rotation.x += deltaY * 0.01;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        document.addEventListener('mouseup', () => { isDragging = false; });

        document.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(5, Math.min(30, camera.position.z));
        });

        let currentSpeed = 0;
        const speedText = document.getElementById('speedText');
        const powerBtn = document.getElementById('powerBtn');
        const speedBtns = document.querySelectorAll('.speed-btn');

        const speedSettings = {
            0: { speed: 0, text: 'Off' },
            1: { speed: 2, text: 'Low' },
            2: { speed: 4, text: 'Medium' },
            3: { speed: 8, text: 'High' }
        };

        function toggleFan() {
            setSpeed(currentSpeed === 0 ? 2 : 0);
        }

        function setSpeed(speed) {
            currentSpeed = speed;
            const setting = speedSettings[speed];
            if (speed === 0) {
                powerBtn.classList.remove('active');
                speedBtns.forEach(btn => btn.classList.remove('active'));
            } else {
                powerBtn.classList.add('active');
                speedBtns.forEach((btn, idx) => btn.classList.toggle('active', idx === speed - 1));
            }
            speedText.textContent = setting.text;
        }

        function animate() {
            requestAnimationFrame(animate);
            if (currentSpeed > 0) {
                bladeGroup.rotation.x += speedSettings[currentSpeed].speed * 0.01;
            }
            renderer.render(scene, camera);
        }

        setSpeed(0);
        animate();
    </script>
</body>
</html>
