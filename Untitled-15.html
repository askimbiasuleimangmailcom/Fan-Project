<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Vintage Metal Desk Fan Assembly</title>
    <style>
        :root {
            --blade-rotation: 0deg;
            --vibrate-speed: 0s;
            --indicator-color: #4b5563;
            --tilt-x: -12deg;
            --rotate-y: -25deg;
            --magnetic-glow: rgba(76, 217, 100, 0);
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #f5f6fa, #bdc3c7);
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            perspective: 1500px;
            overflow-x: hidden;
            box-sizing: border-box;
            padding: 10px;
        }

        /* --- DASHBOARD CONTROL PANEL --- */
        .dashboard {
            width: 100%;
            max-width: 850px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            margin-top: 10px;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: center;
            z-index: 100;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.6);
        }

        .dash-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-align: center;
        }

        .dash-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: #7f8c8d;
            letter-spacing: 0.8px;
        }

        .dash-btn {
            width: 100%;
            max-width: 180px;
            padding: 10px 15px;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid #e1e2e6;
            background: #f8f9fa;
            color: #2c3e50;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
        }

        .dash-btn.active-state {
            background: #2c3e50;
            color: #fff;
            border-color: #2c3e50;
        }

        .speed-group {
            display: flex;
            gap: 6px;
            justify-content: center;
            width: 100%;
        }

        .speed-group .dash-btn {
            width: 40px;
            padding: 10px 0;
        }

        .hint-text {
            font-size: 12px;
            color: #34495e;
            margin: 8px 0;
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            max-width: 90%;
            line-height: 1.4;
        }

        /* --- 3D VIEWPORT VIEW STAGE --- */
        .viewport-3d {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            min-height: 550px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .scene-3d {
            width: 100%;
            height: 100%;
            min-height: 500px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(var(--tilt-x)) rotateY(var(--rotate-y));
            transition: transform 0.1s ease-out;
        }

        /* --- MOVABLE INTERACTIVE COMPONENTS --- */
        .movable-component {
            position: absolute;
            transform-style: preserve-3d;
        }

        .movable-component.draggable-active {
            cursor: move !important;
        }

        .movable-component::before {
            content: 'Double-Click to Move';
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%) translateZ(80px);
            background: rgba(44, 62, 80, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .movable-component:hover::before {
            opacity: 1;
        }

        .movable-component.draggable-active::before {
            content: 'Dragging Mode Active';
            background: #d35400;
            opacity: 1;
        }

        /* Fixed Wall Unit Container Boundary */
        .static-wall-component {
            position: absolute;
            transform-style: preserve-3d;
            left: 8%;
            top: 20%;
        }

        /* --- WALL SOCKET HOUSING --- */
        .wall-panel {
            width: 160px;
            height: 220px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 5px 10px 30px rgba(0,0,0,0.15), inset -2px -2px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 20px 0;
            box-sizing: border-box;
            border: 1px solid #e6e8eb;
            transform-style: preserve-3d;
        }

        .socket-switch {
            width: 34px;
            height: 48px;
            background: #cbd5e1;
            border-radius: 6px;
            position: relative;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.2);
            cursor: pointer;
            perspective: 100px;
            z-index: 50;
        }

        .switch-toggle {
            width: 100%;
            height: 24px;
            background: linear-gradient(to bottom, #ffffff, #f1f2f6);
            border-radius: 4px;
            position: absolute;
            top: 2px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom center;
            transform: rotateX(10deg);
        }

        .socket-switch.on-state .switch-toggle {
            top: 22px;
            background: linear-gradient(to bottom, #ff4d4d, #ff1a1a);
            box-shadow: 0 4px 10px rgba(255, 26, 26, 0.4);
            transform-origin: top center;
            transform: rotateX(-10deg);
        }

        .socket-outlets {
            width: 80px;
            height: 80px;
            background: #f1f2f6;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border: 1px solid #dcdde1;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.08);
            cursor: pointer;
        }

        .pin-hole { 
            width: 8px; height: 14px; background: #1e272e; border-radius: 3px; position: absolute;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); pointer-events: none;
        }
        .pin-hole.earth { top: 16px; left: 36px; width: 12px; height: 8px; }
        .pin-hole.live { bottom: 22px; right: 20px; }
        .pin-hole.neutral { bottom: 22px; left: 20px; }

        /* --- EXTENSION WIRE PLUG UNIT --- */
        .plug {
            width: 56px;
            height: 56px;
            background: #1e2530;
            border-radius: 12px 12px 24px 24px;
            position: absolute;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            z-index: 5;
        }
        .plug.unplugged-state { cursor: grab; }
        .plug.unplugged-state:active { cursor: grabbing; }
        .plug.plugged-state { cursor: pointer; z-index: 15; transform: translate3d(0px, 0px, 5px) !important; }
        .plug-wire-stub { width: 12px; height: 25px; background: #34495e; position: absolute; bottom: -20px; border-radius: 4px; }
        
        .plug-pins { position: absolute; width: 100%; height: 100%; transform: translateZ(-15px); pointer-events: none; }
        .plug.plugged-state .plug-pins { display: none; }
        .metal-prong { position: absolute; width: 7px; height: 13px; background: linear-gradient(to bottom, #f1f2f6, #747d8c); border-radius: 2px; }
        .metal-prong.e { top: 10px; left: 24.5px; width: 11px; height: 7px; }
        .metal-prong.l { bottom: 16px; right: 14px; }
        .metal-prong.n { bottom: 16px; left: 14px; }

        .cable-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

        /* --- NEW VINTAGE CHROME METAL FAN ARCHITECTURE --- */
        .fan-3d-model {
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .fan-head-assembly {
            position: relative;
            animation: vibrate var(--vibrate-speed) linear infinite;
            transform-style: preserve-3d;
            z-index: 4;
        }

        /* Metallic Cage Exterior Outer Ring Rim */
        .cage {
            width: 290px;
            height: 290px;
            border: 7px solid #dfe6e9;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 20px 45px rgba(0,0,0,0.25), inset 0 0 15px rgba(255,255,255,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* High Density Concentric Radial Spokes */
        .grill-mesh, .grill-mesh-rear {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            pointer-events: none;
            transform-style: preserve-3d;
        }
        .grill-mesh { transform: translateZ(18px); }
        .grill-mesh-rear { transform: translateZ(-18px); }

        .spoke {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #b2bec3 20%, #b2bec3 80%, transparent);
            top: 50%;
            transform-origin: center center;
        }
        .spoke-1  { transform: rotate(0deg); }
        .spoke-2  { transform: rotate(22.5deg); }
        .spoke-3  { transform: rotate(45deg); }
        .spoke-4  { transform: rotate(67.5deg); }
        .spoke-5  { transform: rotate(90deg); }
        .spoke-6  { transform: rotate(112.5deg); }
        .spoke-7  { transform: rotate(135deg); }
        .spoke-8  { transform: rotate(157.5deg); }

        /* Metallic Concentric Support Hoops */
        .grill-hoop {
            position: absolute;
            border: 1.5px solid rgba(178, 190, 195, 0.7);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .hoop-1 { width: 90px; height: 90px; }
        .hoop-2 { width: 170px; height: 170px; }
        .hoop-3 { width: 240px; height: 240px; }

        /* Vintage Wide Chrome Metallic Fan Blades */
        .blade-assembly {
            width: 260px;
            height: 260px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotate(var(--blade-rotation)) translateZ(6px);
            transform-style: preserve-3d;
        }

        .blade {
            position: absolute;
            width: 85px;
            height: 120px;
            background: linear-gradient(135deg, #f5f6fa 0%, #dcdde1 40%, #747d8c 100%);
            opacity: 0.95;
            border-radius: 45% 45% 40% 40% / 30% 30% 70% 70%;
            transform-origin: bottom center;
            box-shadow: inset -4px 4px 10px rgba(255,255,255,0.8), 2px 8px 12px rgba(0,0,0,0.15);
        }
        .blade-1 { transform: translateY(-60px) rotate(0deg) rotateY(12deg); }
        .blade-2 { transform: translateY(-60px) rotate(120deg) rotateY(12deg); }
        .blade-3 { transform: translateY(-60px) rotate(240deg) rotateY(12deg); }

        /* Polished Mirror Center Mirror Cap Hub */
        .center-cap {
            position: absolute;
            width: 54px;
            height: 54px;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #dcdde1 45%, #7f8c8d 100%);
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translateZ(24px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }

        /* --- CHROMIUM BULLET STYLE MOTOR HOUSING --- */
        .electric-motor-housing {
            position: absolute;
            width: 110px;
            height: 125px;
            transform: translateZ(-80px); 
            transform-style: preserve-3d;
        }

        /* Polished Bullet Shape Cylinder Shell Skin */
        .motor-cylinder {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #747d8c 0%, #dfe6e9 25%, #ffffff 50%, #b2bec3 85%, #747d8c 100%);
            border-radius: 50% 50% 45% 45% / 15% 15% 15% 15%;
            transform-style: preserve-3d;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
        }

        /* Integrated Rear Wire Output Clip Loop */
        .motor-cylinder::after {
            content: '';
            position: absolute;
            width: 8px; height: 16px;
            background: #2f3542;
            bottom: 12px; left: 51px;
            border-radius: 3px;
            transform: translateZ(-1px);
        }

        /* Curved Rounded Back Dome Shell Plate */
        .motor-rear-cap {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 40% 40%, #ffffff 0%, #b2bec3 50%, #57606f 100%);
            border-radius: 50%;
            transform: translateZ(-40px) scale(0.96);
            border: 1px solid #dfe6e9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.2);
        }

        /* Perimeter Cooling Air Exchanger Vents */
        .motor-vent-slot {
            width: 45px;
            height: 3.5px;
            background: #1e272e;
            border-radius: 2px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
        }

        /* Mechanical Vertical Reciprocating Oscillation Clutch Control Pin */
        .oscillation-knob {
            position: absolute;
            width: 15px;
            height: 25px;
            background: radial-gradient(circle at center, #ffffff, #b2bec3);
            border: 2px solid #747d8c;
            top: -15px;
            left: 45px;
            border-radius: 4px;
            transform: rotateX(90deg);
            box-shadow: 0 5px 8px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .oscillation-knob:active { transform: rotateX(90deg) translateY(4px); }

        /* Solid Heavy Duty Pivot Swivel Bracket Arm Connecting to Stand Neck Base */
        .motor-mount-bracket {
            position: absolute;
            width: 130px;
            height: 14px;
            background: #b2bec3;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(-15px);
            border-radius: 4px;
            border: 1px solid #747d8c;
        }
        .motor-mount-bracket.vertical { 
            transform: translate(-50%, -50%) rotate(90deg) translateZ(-15px); 
            height: 20px;
            width: 120px;
            background: linear-gradient(to right, #747d8c, #dfe6e9, #57606f);
        }

        /* --- ERGONOMIC CURVED SWIVEL NECK & BUTTON CONTROL PEDESTAL --- */
        /* Updated to model the heavy-duty chrome cast body base layout of the real-life metal fan reference image */
        .neck {
            width: 70px;
            height: 165px;
            background: linear-gradient(to right, #747d8c 0%, #dfe6e9 35%, #ffffff 65%, #95a5a6 100%);
            margin-top: -6px;
            clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 15px 0 20px 0;
            box-sizing: border-box;
            border-bottom: 2px solid #747d8c;
        }

        /* Front-mounted mechanical push buttons built right onto the support pillar housing */
        .btn-panel-vertical {
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            background: linear-gradient(to bottom, #747d8c, #57606f);
            padding: 10px 6px; 
            border-radius: 20px; 
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.4), 0 1px 1px rgba(255,255,255,0.2); 
            z-index: 60;
            transform: translateZ(12px);
        }

        .btn-panel-vertical button {
            width: 26px; height: 26px; 
            border: 1.5px solid #57606f; 
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #cbd5e1 50%, #7f8c8d 100%); 
            font-size: 10px; font-weight: 900;
            color: #2c3e50; cursor: pointer; outline: none; 
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
            position: relative; pointer-events: auto; z-index: 70;
            transition: all 0.15s ease;
        }

        .btn-panel-vertical button.active {
            background: radial-gradient(circle at center, #7f8c8d 0%, #2c3e50 100%); 
            color: #fff; 
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.6);
            transform: scale(0.92);
        }

        /* Integrated LED Status Glow Indicator Ring */
        .indicator {
            width: 12px; height: 12px; 
            background-color: var(--indicator-color); 
            border-radius: 50%;
            box-shadow: 0 0 14px var(--indicator-color); 
            transition: all 0.25s ease;
            margin-bottom: 8px;
            border: 1px solid rgba(0,0,0,0.2);
        }

        /* Solid Cast Iron Flared Semi-Dome Stand Base Profile */
        .base-group { display: flex; flex-direction: column; align-items: center; margin-top: -14px; z-index: 1; transform-style: preserve-3d; }
        .base-top { 
            width: 190px; height: 22px; 
            background: linear-gradient(to right, #747d8c 0%, #dfe6e9 30%, #ffffff 70%, #57606f 100%); 
            border-radius: 100px / 22px; 
        }
        .base-bottom { 
            width: 250px; height: 30px; 
            background: linear-gradient(to bottom, #dfe6e9 0%, #747d8c 40%, #2c3e50 100%); 
            border-radius: 100px / 30px; 
            margin-top: -14px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.35); 
        }

        @media (max-width: 768px) {
            .scene-3d { transform: scale(0.7) rotateX(var(--tilt-x)) rotateY(var(--rotate-y)); }
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="dash-group">
            <div class="dash-label">Power Attachment</div>
            <button class="dash-btn" id="dashPlugBtn" onclick="togglePlugAction()">Plug In</button>
        </div>
        <div class="dash-group">
            <div class="dash-label">Wall Socket Switch</div>
            <button class="dash-btn" id="dashSwitchBtn" onclick="toggleSwitchAction()">Turn ON</button>
        </div>
        <div class="dash-group">
            <div class="dash-label">Rotational Fan Speed</div>
            <div class="speed-group">
                <button class="dash-btn speed-btn active-state" id="dashSpeedBtn0" onclick="setSpeedEngine(0, event)">0</button>
                <button class="dash-btn speed-btn" id="dashSpeedBtn1" onclick="setSpeedEngine(1, event)">1</button>
                <button class="dash-btn speed-btn" id="dashSpeedBtn2" onclick="setSpeedEngine(2, event)">2</button>
                <button class="dash-btn speed-btn" id="dashSpeedBtn3" onclick="setSpeedEngine(3, event)">3</button>
            </div>
        </div>
    </div>

    <div class="hint-text">
        ✨ <b>Vintage Update:</b> Rendered fully custom 3D chrome metallic blades and bullet-style motor housing based on your image specs! <br>
        🖱️ <b>Double-Click to Move:</b> Unlock and drag either the <b>Metal Fan Assembly</b> or the <b>Power Cord Adapter Plug</b> dynamically.
    </div>

    <div class="viewport-3d" id="viewport">
        <svg class="cable-svg">
            <path id="cablePath" d="" fill="none" stroke="#2c3e50" stroke-width="7" stroke-linecap="round"/>
        </svg>

        <div class="scene-3d" id="scene">
            
            <div class="static-wall-component" id="staticSocketContainer">
                <div class="wall-panel" id="wallPanel">
                    <div class="socket-switch" id="wallSwitch" onclick="toggleSwitchAction(event)">
                        <div class="switch-toggle"></div>
                    </div>
                    <div class="socket-outlets" id="targetSocket" onclick="togglePlugAction(event)">
                        <div class="pin-hole earth"></div>
                        <div class="pin-hole live"></div>
                        <div class="pin-hole neutral"></div>
                    </div>
                </div>
            </div>

            <div class="plug unplugged-state" id="powerPlug" style="left: 250px; top: 380px;">
                <div class="plug-wire-stub"></div>
                <div class="plug-pins">
                    <div class="metal-prong e"></div>
                    <div class="metal-prong l"></div>
                    <div class="metal-prong n"></div>
                </div>
            </div>

            <div class="movable-component" id="wrapFan" style="left: 52%; top: 12%;">
                <div class="fan-3d-model" id="fanBody">
                    <div class="fan-head-assembly" id="fanHead">
                        <div class="cage">
                            <div class="grill-mesh">
                                <div class="spoke spoke-1"></div><div class="spoke spoke-2"></div>
                                <div class="spoke spoke-3"></div><div class="spoke spoke-4"></div>
                                <div class="spoke spoke-5"></div><div class="spoke spoke-6"></div>
                                <div class="spoke spoke-7"></div><div class="spoke spoke-8"></div>
                                <div class="grill-hoop hoop-1"></div><div class="grill-hoop hoop-2"></div><div class="grill-hoop hoop-3"></div>
                            </div>

                            <div class="blade-assembly" id="fanBlades">
                                <div class="blade blade-1"></div>
                                <div class="blade blade-2"></div>
                                <div class="blade blade-3"></div>
                            </div>
                            <div class="center-cap"></div>

                            <div class="grill-mesh-rear">
                                <div class="spoke spoke-1"></div><div class="spoke spoke-2"></div>
                                <div class="spoke spoke-3"></div><div class="spoke spoke-4"></div>
                                <div class="spoke spoke-5"></div><div class="spoke spoke-6"></div>
                                <div class="spoke spoke-7"></div><div class="spoke spoke-8"></div>
                                <div class="grill-hoop hoop-1"></div><div class="grill-hoop hoop-2"></div><div class="grill-hoop hoop-3"></div>
                            </div>

                            <div class="motor-mount-bracket horizontal"></div>
                            <div class="motor-mount-bracket vertical"></div>

                            <div class="electric-motor-housing">
                                <div class="motor-cylinder">
                                    <div class="motor-rear-cap">
                                        <div class="oscillation-knob"></div>
                                        <div class="motor-vent-slot"></div>
                                        <div class="motor-vent-slot"></div>
                                        <div class="motor-vent-slot"></div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="neck">
                        <div class="indicator" id="statusLight"></div>
                        <div class="btn-panel-vertical">
                            <button id="fanBtn0" class="active" onclick="setSpeedEngine(0, event)">0</button>
                            <button id="fanBtn1" onclick="setSpeedEngine(1, event)">1</button>
                            <button id="fanBtn2" onclick="setSpeedEngine(2, event)">2</button>
                            <button id="fanBtn3" onclick="setSpeedEngine(3, event)">3</button>
                        </div>
                    </div>

                    <div class="base-group">
                        <div class="base-top"></div>
                        <div class="base-bottom" id="fanBase"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const root = document.documentElement;

        // Core Operating Logic Parameters
        let isPluggedIn = false;
        let isSocketOn = false;
        let selectedSpeed = 0;

        let currentRotation = 0;
        let currentSpeed = 0;   
        let targetSpeed = 0;    
        const acceleration = 0.12; 
        const deceleration = 0.04;

        let audioCtx = null, biquadFilter = null, gainNode = null, noiseSource = null;

        // View Orientation Vectors
        let isDraggingBackground = false, previousX = 0, previousY = 0;
        let currentRotateY = -25, currentTiltX = -12;

        // Cable Traversal Trackers
        let isDraggingPlug = false;
        let plugX = 250, plugY = 380; 
        let startDragX = 0, startDragY = 0;

        // Move Engine Configuration Matrices
        let activeComponentDragging = null;
        let compStartX = 0, compStartY = 0;

        const viewport = document.getElementById('viewport');
        const scene = document.getElementById('scene');
        const powerPlug = document.getElementById('powerPlug');
        const targetSocket = document.getElementById('targetSocket');
        const wrapFan = document.getElementById('wrapFan');

        // --- COMPONENT ATTRIBUTE REGISTER CONTROLLERS ---
        function setupDoubleClickHandler(element) {
            element.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                if (activeComponentDragging === element) {
                    activeComponentDragging = null;
                    element.classList.remove('draggable-active');
                } else {
                    if (activeComponentDragging) {
                        activeComponentDragging.classList.remove('draggable-active');
                    }
                    activeComponentDragging = element;
                    element.classList.add('draggable-active');
                }
            });
        }

        // Apply interactive toggle handlers
        setupDoubleClickHandler(wrapFan);
        setupDoubleClickHandler(powerPlug);

        function getPointerCoords(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        document.addEventListener('mousedown', onStartEngine);
        document.addEventListener('mousemove', onMoveEngine);
        document.addEventListener('mouseup', onEndEngine);
        document.addEventListener('touchstart', onStartEngine, {passive: false});
        document.addEventListener('touchmove', onMoveEngine, {passive: true});
        document.addEventListener('touchend', onEndEngine);

        function onStartEngine(e) {
            if (e.target.closest('.dashboard') || e.target.closest('button') || e.target.closest('.socket-switch')) return;
            
            const coords = getPointerCoords(e);
            const viewRect = viewport.getBoundingClientRect();

            // Track selective element relocation adjustments if a double-click token flag is set
            if (activeComponentDragging) {
                const compRect = activeComponentDragging.getBoundingClientRect();
                if (activeComponentDragging === powerPlug && isPluggedIn) {
                    disconnectPlugSystem();
                }
                compStartX = coords.x - compRect.left;
                compStartY = coords.y - compRect.top;
                return;
            }

            // Standard manual wire line manipulation pathing fallback if not locked
            if (e.target.closest('#powerPlug')) {
                if (isPluggedIn) {
                    disconnectPlugSystem();
                    return;
                }
                isDraggingPlug = true;
                const rect = powerPlug.getBoundingClientRect();
                startDragX = coords.x - (rect.left - viewRect.left);
                startDragY = coords.y - (rect.top - viewRect.top);
                if (e.cancelable) e.preventDefault();
                return;
            }

            // Global Canvas Orbit Rotation Trigger
            isDraggingBackground = true;
            previousX = coords.x; 
            previousY = coords.y;
        }

        function onMoveEngine(e) {
            const coords = getPointerCoords(e);
            const viewRect = viewport.getBoundingClientRect();

            // Coordinate shifting loop logic for active drag nodes
            if (activeComponentDragging) {
                let leftPos = ((coords.x - viewRect.left - compStartX) / viewRect.width) * 100;
                let topPos = ((coords.y - viewRect.top - compStartY) / viewRect.height) * 100;
                
                activeComponentDragging.style.left = `${Math.max(0, Math.min(leftPos, 90))}%`;
                activeComponentDragging.style.top = `${Math.max(0, Math.min(topPos, 85))}%`;
                drawConnectingCable();
                return;
            }

            // Drag tracking loop logic for the manual extension wire component block
            if (isDraggingPlug && !isPluggedIn) {
                let x = coords.x - viewRect.left - startDragX;
                let y = coords.y - viewRect.top - startDragY;

                plugX = Math.max(0, Math.min(viewRect.width - 56, x));
                plugY = Math.max(0, Math.min(viewRect.height - 56, y));

                powerPlug.style.left = `${plugX}px`;
                powerPlug.style.top = `${plugY}px`;
                drawConnectingCable();

                const socketRect = targetSocket.getBoundingClientRect();
                const plugRect = powerPlug.getBoundingClientRect();
                const distance = Math.hypot(
                    (plugRect.left + plugRect.width/2) - (socketRect.left + socketRect.width/2),
                    (plugRect.top + plugRect.height/2) - (socketRect.top + socketRect.height/2)
                );

                if (distance < 60) {
                    root.style.setProperty('--magnetic-glow', 'rgba(76, 217, 100, 0.4)');
                    targetSocket.style.boxShadow = "inset 0 4px 8px rgba(0,0,0,0.08), 0 0 15px var(--magnetic-glow)";
                } else {
                    targetSocket.style.boxShadow = "inset 0 4px 8px rgba(0,0,0,0.08)";
                }
                return;
            }

            if (!isDraggingBackground) return;
            let deltaX = coords.x - previousX;
            let deltaY = coords.y - previousY;
            currentRotateY += deltaX * 0.4;
            currentTiltX = Math.max(-45, Math.min(45), currentTiltX - deltaY * 0.4);
            root.style.setProperty('--rotate-y', `${currentRotateY}deg`);
            root.style.setProperty('--tilt-x', `${currentTiltX}deg`);
            previousX = coords.x; 
            previousY = coords.y;
            drawConnectingCable();
        }

        function onEndEngine() {
            if (isDraggingPlug && !isPluggedIn) {
                isDraggingPlug = false;
                targetSocket.style.boxShadow = "inset 0 4px 8px rgba(0,0,0,0.08)";

                const socketRect = targetSocket.getBoundingClientRect();
                const plugRect = powerPlug.getBoundingClientRect();
                const distance = Math.hypot(
                    (plugRect.left + plugRect.width/2) - (socketRect.left + socketRect.width/2),
                    (plugRect.top + plugRect.height/2) - (socketRect.top + socketRect.height/2)
                );

                if (distance < 60) connectPlugSystem();
            }
            isDraggingBackground = false;
        }

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

            noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer;
            noiseSource.loop = true;

            biquadFilter = audioCtx.createBiquadFilter();
            biquadFilter.type = "LOWPASS";

            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0;

            noiseSource.connect(biquadFilter);
            biquadFilter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            noiseSource.start();
        }

        // --- HARDWARE POWER INTERFACE PIPELINES ---
        function connectPlugSystem() {
            isPluggedIn = true;
            const btn = document.getElementById('dashPlugBtn');
            btn.innerText = "UNPLUG";
            btn.classList.add('active-state');

            powerPlug.classList.remove('unplugged-state');
            powerPlug.classList.add('plugged-state');
            
            targetSocket.appendChild(powerPlug);
            powerPlug.style.left = '12px'; 
            powerPlug.style.top = '12px';

            if (activeComponentDragging === powerPlug) {
                activeComponentDragging.classList.remove('draggable-active');
                activeComponentDragging = null;
            }

            evaluateSystemPower();
            setTimeout(drawConnectingCable, 50);
        }

        function disconnectPlugSystem() {
            isPluggedIn = false;
            const btn = document.getElementById('dashPlugBtn');
            btn.innerText = "PLUG IN";
            btn.classList.remove('unplugged-state');

            powerPlug.classList.remove('plugged-state');
            powerPlug.classList.add('unplugged-state');
            
            viewport.appendChild(powerPlug);
            
            plugX = 250; plugY = 380;
            powerPlug.style.left = `${plugX}px`;
            powerPlug.style.top = `${plugY}px`;

            evaluateSystemPower();
            setTimeout(drawConnectingCable, 50);
        }

        function togglePlugAction(e) {
            if(e) e.stopPropagation();
            if (!isPluggedIn) connectPlugSystem();
            else disconnectPlugSystem();
        }

        function toggleSwitchAction(e) {
            if(e) e.stopPropagation();
            const btn = document.getElementById('dashSwitchBtn');
            const wallSw = document.getElementById('wallSwitch');
            isSocketOn = !isSocketOn;

            if (isSocketOn) {
                btn.innerText = "TURN OFF";
                btn.classList.add('active-state');
                wallSw.classList.add('on-state');
            } else {
                btn.innerText = "TURN ON";
                btn.classList.remove('active-state');
                wallSw.classList.remove('on-state');
            }
            evaluateSystemPower();
        }

        function setSpeedEngine(speed, e) {
            if(e) e.stopPropagation();
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

            document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active-state'));
            document.getElementById(`dashSpeedBtn${speed}`).classList.add('active-state');

            document.querySelectorAll('.btn-panel-vertical button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`fanBtn${speed}`).classList.add('active');

            selectedSpeed = speed;
            evaluateSystemPower();
        }

        function evaluateSystemPower() {
            if (isPluggedIn && isSocketOn && selectedSpeed > 0) {
                root.style.setProperty('--indicator-color', '#4cd964');
                switch(selectedSpeed) {
                    case 1: targetSpeed = 5; root.style.setProperty('--vibrate-speed', '0.2s'); break;
                    case 2: targetSpeed = 12;  root.style.setProperty('--vibrate-speed', '0.08s'); break;
                    case 3: targetSpeed = 28;  root.style.setProperty('--vibrate-speed', '0.03s'); break;
                }
            } else {
                targetSpeed = 0;
                root.style.setProperty('--vibrate-speed', '0s');
                root.style.setProperty('--indicator-color', (isPluggedIn && isSocketOn) ? '#ff3b30' : '#4b5563');
            }
        }

        function drawConnectingCable() {
            const base = document.getElementById('fanBase');
            const path = document.getElementById('cablePath');

            const plugRect = powerPlug.getBoundingClientRect();
            const baseRect = base.getBoundingClientRect();
            const viewRect = viewport.getBoundingClientRect();

            const x1 = plugRect.left - viewRect.left + (plugRect.width / 2);
            const y1 = plugRect.top - viewRect.top + plugRect.height - (isPluggedIn ? 15 : 0);
            const x2 = baseRect.left - viewRect.left + (baseRect.width / 2);
            const y2 = baseRect.top - viewRect.top + (baseRect.height / 2);

            const controlY = Math.max(y1, y2) + 140; 
            path.setAttribute('d', `M ${x1} ${y1} Q ${(x1 + x2) / 2} ${controlY} ${x2} ${y2}`);
        }

        function runPhysicsSimulationLoop() {
            if (currentSpeed < targetSpeed) {
                currentSpeed += acceleration;
                if (currentSpeed > targetSpeed) currentSpeed = targetSpeed;
            } else if (currentSpeed > targetSpeed) {
                currentSpeed -= deceleration;
                if (currentSpeed < targetSpeed) currentSpeed = targetSpeed;
            }

            currentRotation += currentSpeed;
            if (currentRotation >= 360) currentRotation -= 360;
            root.style.setProperty('--blade-rotation', `${currentRotation}deg`);

            if (gainNode && biquadFilter) {
                if (currentSpeed > 0.05) {
                    gainNode.gain.value = Math.min(0.01 + (currentSpeed / 60), 0.3);
                    biquadFilter.frequency.value = 110 + (currentSpeed * 15);
                } else {
                    gainNode.gain.value = 0;
                }
            }

            drawConnectingCable();
            requestAnimationFrame(runPhysicsSimulationLoop);
        }

        window.addEventListener('resize', drawConnectingCable);
        setTimeout(drawConnectingCable, 200);
        runPhysicsSimulationLoop();
    </script>
</body>
</html>
