<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fan Speed Control</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #e8f1ff, #f7fbff);
      color: #222;
    }

    .container {
      text-align: center;
      padding: 30px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: min(90%, 420px);
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2rem;
    }

    .fan {
      width: 180px;
      height: 180px;
      margin: 0 auto 20px;
      border-radius: 50%;
      border: 10px solid #333;
      position: relative;
      background: radial-gradient(circle, #ddd 0%, #bbb 60%, #999 100%);
      overflow: hidden;
      animation: spin 1s linear infinite;
      animation-play-state: paused;
    }

    .blade {
      position: absolute;
      width: 40px;
      height: 80px;
      background: linear-gradient(to bottom, #666, #222);
      border-radius: 50% 50% 10px 10px;
      top: 20px;
      left: 50%;
      transform-origin: center 70px;
      transform: translateX(-50%);
    }

    .blade:nth-child(2) {
      transform: translateX(-50%) rotate(120deg);
    }

    .blade:nth-child(3) {
      transform: translateX(-50%) rotate(240deg);
    }

    .center {
      position: absolute;
      width: 40px;
      height: 40px;
      background: #222;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .controls {
      margin-top: 20px;
      display: grid;
      gap: 15px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #1f4b99;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #163a75;
    }

    .slider-box {
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #1f4b99;
    }

    .status {
      margin-top: 15px;
      font-size: 1rem;
      font-weight: bold;
    }

    .speed-value {
      color: #1f4b99;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fan Speed Control</h1>

    <div class="fan" id="fan">
      <div class="blade"></div>
      <div class="blade"></div>
      <div class="blade"></div>
      <div class="center"></div>
    </div>

    <div class="controls">
      <button id="toggleBtn">Turn Fan On</button>

      <div class="slider-box">
        <label for="speedRange">Fan Speed</label>
        <input type="range" id="speedRange" min="1" max="5" value="1">
      </div>
    </div>

    <div class="status" id="status">Fan is OFF</div>
    <div class="status">Speed: <span class="speed-value" id="speedValue">1</span></div>
  </div>

  <script>
    const fan = document.getElementById("fan");
    const toggleBtn = document.getElementById("toggleBtn");
    const speedRange = document.getElementById("speedRange");
    const status = document.getElementById("status");
    const speedValue = document.getElementById("speedValue");

    let fanOn = false;

    function updateSpeed() {
      const speed = speedRange.value;
      speedValue.textContent = speed;

      // Higher slider value = faster fan
      const duration = 6 - speed;
      fan.style.animationDuration = duration + "s";
    }

    toggleBtn.addEventListener("click", () => {
      fanOn = !fanOn;

      if (fanOn) {
        fan.style.animationPlayState = "running";
        toggleBtn.textContent = "Turn Fan Off";
        status.textContent = "Fan is ON";
      } else {
        fan.style.animationPlayState = "paused";
        toggleBtn.textContent = "Turn Fan On";
        status.textContent = "Fan is OFF";
      }
    });

    speedRange.addEventListener("input", updateSpeed);

    updateSpeed();
  </script>
</body>
</html>
