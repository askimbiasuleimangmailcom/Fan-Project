<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fan On/Off</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f6fb;
      color: #222;
    }

    .container {
      text-align: center;
    }

    .fan {
      width: 180px;
      height: 180px;
      margin: 0 auto 20px;
      border-radius: 50%;
      border: 10px solid #333;
      position: relative;
      background: radial-gradient(circle, #ddd 0%, #bbb 60%, #999 100%);
      overflow: hidden;
    }

    .blade {
      position: absolute;
      width: 40px;
      height: 80px;
      background: linear-gradient(to bottom, #666, #222);
      border-radius: 50% 50% 10px 10px;
      top: 20px;
      left: 50%;
      transform-origin: center 70px;
      transform: translateX(-50%);
    }

    .blade:nth-child(2) {
      transform: translateX(-50%) rotate(120deg);
    }

    .blade:nth-child(3) {
      transform: translateX(-50%) rotate(240deg);
    }

    .center {
      position: absolute;
      width: 40px;
      height: 40px;
      background: #222;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .fan.spinning {
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    button {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background: #1f4b99;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #163a75;
    }

    .status {
      margin-top: 15px;
      font-size: 1.1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="fan" id="fan">
      <div class="blade"></div>
      <div class="blade"></div>
      <div class="blade"></div>
      <div class="center"></div>
    </div>

    <button id="toggleBtn">Turn Fan On</button>
    <div class="status" id="status">Fan is OFF</div>
  </div>

  <script>
    const fan = document.getElementById("fan");
    const button = document.getElementById("toggleBtn");
    const status = document.getElementById("status");

    let fanOn = false;

    button.addEventListener("click", () => {
      fanOn = !fanOn;

      if (fanOn) {
        fan.classList.add("spinning");
        button.textContent = "Turn Fan Off";
        status.textContent = "Fan is ON";
      } else {
        fan.classList.remove("spinning");
        button.textContent = "Turn Fan On";
        status.textContent = "Fan is OFF";
      }
    });
  </script>
</body>
</html>
